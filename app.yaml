id: hospitality
name: Hospitality
version: 0.3.1
publisher: cbferrum
summary: "A hotel's front office: rooms, rate plans, a booking page, deposits, stays from reservation to check-out, folios with outlets' charges, housekeeping and the night audit"
description: README.md
categories: [sales, industry]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-hospitality
support: https://github.com/CBFerrum/ferrum-app-hospitality/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Records of ERP (items, customers, invoices): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [hospitality]
uninstall: ask
# Its own interface at /hotel/: the front desk (arrivals, in the house, departures), the rooms, and
# the records frame for everything else (ui/, built into ui/dist).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: hospitality
      route: hotel
      title: Hotel
      description: The front desk, rooms, stays and the night audit
      icon: bed-double
      color: "#9a3412"
      roles: [Hotel Manager, Front Desk, Housekeeping, Housekeeping Supervisor, Outlet Cashier]
  shell.open:
    - {id: hospitality, package: hospitality, path: "hotel/e/{entity}/{id}", list: "hotel/e/{entity}"}
  shell.create:
    - {id: stay, label: Stay, path: hotel/e/Stay/new, entity: Stay}
  # What guests open without signing in: /hotel/book/{workspace}, and their own reservation below it.
  shell.public:
    - {id: book, path: hotel/book, title: Book a room}
  # What the assistant should know in Hospitality's pages, and what it suggests asking there.
  shell.assistant:
    - id: hospitality
      title: "Hospitality"
      instructions: >-
        A Stay is Reserved, Checked In, Checked Out, Cancelled or No Show. Its Folio (Open, Closed) collects room
        charges and extras (FolioCharge) and payments (FolioPayment). Rates come from the RatePlan and its seasons.
        The NightAudit closes each business day and posts the night's room charges.
      suggestions:
        - "Who arrives today, and who leaves?"
        - "Which rooms are free tonight?"
        - "What do open folios still owe?"
        - "What was last night's occupancy?"
